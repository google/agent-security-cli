name: 🛡️ Propose New Security Rule / STRIDE Check
description: Propose a new AST security check, prompt injection pattern, or MCP audit rule.
labels: ["enhancement", "security-rule"]
body:
  - type: markdown
    attributes:
      value: We encourage contributors to expand our 8-tier security and cognitive gating rules!
  - type: dropdown
    id: category
    attributes:
      label: Security Engine Target
      options:
        - "Static Code Scanner (Semgrep / Deserialization / Secrets)"
        - "STRIDE Threat Modeler (AST IDOR, Race Conditions, Loops)"
        - "Prompt Guard (Injection, Extraction, Crescendo)"
        - "MCP Security Auditor (SSRF, Schema, Tokens)"
        - "HITL Validator (Mutating Tools, Approvals)"
        - "IAM & Delegated Identity (Context Propagation, Workload Identity)"
        - "PreToolUse Hooks (Destructive Action Blockers)"
    validations:
      required: true
  - type: textarea
    id: rule_concept
    attributes:
      label: Rule Description & Threat Vector
      description: Explain the vulnerability or attack vector this rule prevents.
    validations:
      required: true
  - type: textarea
    id: code_example
    attributes:
      label: Code Example (Vulnerable vs Remediated)
      description: Show sample vulnerable agent code and how it should be detected.
      render: python
