name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in agent-security-cli.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for filing a bug report! Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: CLI Version
      description: What version of agent-security-cli are you running? (e.g. `agent-security info`)
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Commands executed and sample agent structure.
      placeholder: |
        1. Run `agent-security scan ./my-agent`
        2. Encounter error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output & Traceback
      description: Please copy and paste the error output or traceback.
      render: shell
