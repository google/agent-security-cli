[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-cli"
version = "0.2.0"
description = "Enterprise Shift-Left Security, STRIDE Threat Modeling, and Cognitive Gating for AI Agents"
readme = "README.md"
authors = [
  { name = "Ravi Manjunatha", email = "ravi.m.bit@gmail.com" },
  { name = "Krishna Gupta", email = "krishngupt@outlook.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = [
  "ai-agents",
  "llm-security",
  "stride-threat-modeling",
  "mcp-security",
  "human-in-the-loop",
  "langgraph",
  "red-teaming",
  "owasp-llm",
  "prompt-injection"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "click>=8.1.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "build>=1.0.0",
  "twine>=4.0.0"
]

[project.urls]
"Homepage" = "https://github.com/RaviManjunatha/agent-security-cli"
"Repository" = "https://github.com/RaviManjunatha/agent-security-cli.git"
"Bug Tracker" = "https://github.com/RaviManjunatha/agent-security-cli/issues"
"Discussions" = "https://github.com/RaviManjunatha/agent-security-cli/discussions"

[project.scripts]
agent-security = "agent_security.cli:cli"
agent-sec = "agent_security.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
