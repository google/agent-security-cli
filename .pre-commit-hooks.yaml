- id: agent-security-scan
  name: Agent Security Scanner
  description: Scans AI agent source code for hardcoded secrets, unsafe execution, and AST vulnerabilities.
  entry: agent-security scan
  language: python
  types: [python]
  pass_filenames: false
  stages: [pre-commit]

- id: agent-security-hitl
  name: Agent HITL Gating Check
  description: Verifies all mutating tools in AI agents have Human-In-The-Loop approval gates.
  entry: agent-security hitl-check
  language: python
  types: [python]
  pass_filenames: false
  stages: [pre-commit]

- id: agent-security-mcp
  name: Agent MCP Security Auditor
  description: Audits Model Context Protocol (MCP) tool configurations for SSRF, unpinned schemas, and token leakage.
  entry: agent-security mcp-check
  language: python
  types: [json]
  pass_filenames: false
  stages: [pre-commit]
